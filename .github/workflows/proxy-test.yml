# Example: ServiceNow DevOps Update Change with HTTPS Proxy Support
#
# This workflow demonstrates how to route the ServiceNow DevOps Update Change
# action through a corporate HTTPS proxy. The action reads the HTTPS_PROXY
# environment variable and tunnels all requests via HTTP CONNECT.
#
# Required secrets:
#   HTTPS_PROXY_URL           - Proxy URL, e.g. http://<host>:<port> or http://user:pass@<host>:<port>
#   SN_INSTANCE_URL           - ServiceNow instance URL
#   SN_DEVOPS_INTEGRATION_TOKEN - DevOps integration token
#   SN_ORCHESTRATION_TOOL_ID  - Orchestration tool sys_id

name: Proxy Test - DevOps Update Change

on:
  workflow_dispatch:

jobs:

  updateChange:
    name: ServiceNow Update Change
    runs-on: ubuntu-latest

    # Set HTTPS_PROXY so the action routes traffic through your proxy
    env:
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY_URL }}

    steps:
      - name: ServiceNow Update Change
        uses: ServiceNow/servicenow-devops-update-change@feature/https-proxy-agent
        id: update
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          # Provide an existing change request number
          change-request-number: 'CHG0030050'
          change-request-details: '{"short_description":"Updated via proxy","description":"Change updated through HTTPS proxy tunnel"}'

      - name: Output
        run: echo "status=${{ steps.update.outputs.status }}"
